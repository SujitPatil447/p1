<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Blitz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    cursor: crosshair;
  }
  canvas { display: block; }
  #ui-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  #hud {
    position: absolute; top: 20px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .hud-item {
    color: #0ff; font-size: 18px; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    font-weight: bold; letter-spacing: 1px;
  }
  .hud-item span { color: #fff; }
  #combo-display {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #f0f; font-size: 48px; font-weight: bold;
    text-shadow: 0 0 20px #f0f, 0 0 40px #f0f; opacity: 0;
    transition: opacity 0.2s; pointer-events: none;
  }
  #menu-screen, #game-over-screen, #pause-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 10, 15, 0.92); z-index: 100; pointer-events: all;
  }
  .hidden { display: none !important; }
  .title {
    font-size: 72px; font-weight: 900; letter-spacing: 8px;
    background: linear-gradient(135deg, #0ff, #f0f, #ff0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: none; margin-bottom: 10px;
    animation: glow-pulse 2s ease-in-out infinite;
  }
  @keyframes glow-pulse {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(0,255,255,0.5)); }
    50% { filter: brightness(1.3) drop-shadow(0 0 40px rgba(255,0,255,0.8)); }
  }
  .subtitle {
    color: #888; font-size: 16px; letter-spacing: 4px; margin-bottom: 40px;
  }
  .menu-btn {
    background: transparent; border: 2px solid #0ff; color: #0ff;
    padding: 14px 48px; font-size: 20px; letter-spacing: 3px; cursor: pointer;
    margin: 8px; transition: all 0.3s; font-weight: bold; pointer-events: all;
  }
  .menu-btn:hover {
    background: #0ff; color: #0a0a0f;
    box-shadow: 0 0 30px #0ff, 0 0 60px rgba(0,255,255,0.3);
  }
  .menu-btn.pink { border-color: #f0f; color: #f0f; }
  .menu-btn.pink:hover { background: #f0f; color: #0a0a0f; box-shadow: 0 0 30px #f0f; }
  .controls-info {
    color: #555; font-size: 13px; margin-top: 30px; text-align: center; line-height: 2;
  }
  .controls-info kbd {
    background: #222; color: #0ff; padding: 2px 8px; border-radius: 3px;
    border: 1px solid #333; font-family: monospace;
  }
  #final-score {
    font-size: 64px; color: #ff0; font-weight: 900;
    text-shadow: 0 0 20px #ff0, 0 0 40px #ff0; margin: 10px 0;
  }
  #final-wave { color: #0ff; font-size: 22px; margin-bottom: 5px; }
  #final-kills { color: #f0f; font-size: 18px; margin-bottom: 20px; }
  .go-label { color: #f44; font-size: 40px; font-weight: 900; letter-spacing: 6px; margin-bottom: 5px; }
  /* Score submission */
  #score-form {
    display: flex; gap: 10px; margin: 15px 0;
  }
  #score-form input {
    background: #111; border: 2px solid #0ff; color: #fff; padding: 10px 16px;
    font-size: 16px; width: 200px; outline: none;
  }
  #score-form input:focus { box-shadow: 0 0 15px rgba(0,255,255,0.4); }
  #leaderboard {
    margin-top: 15px; width: 340px;
  }
  #leaderboard h3 {
    color: #ff0; font-size: 18px; letter-spacing: 3px; margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(255,255,0,0.5);
  }
  .lb-entry {
    display: flex; justify-content: space-between; padding: 6px 12px;
    color: #aaa; font-size: 14px; border-bottom: 1px solid #1a1a2a;
  }
  .lb-entry:nth-child(2) { color: #ffd700; }
  .lb-entry:nth-child(3) { color: #c0c0c0; }
  .lb-entry:nth-child(4) { color: #cd7f32; }
  .lb-entry .lb-name { flex: 1; }
  .lb-entry .lb-score { color: #0ff; font-weight: bold; }
  /* Powerup indicators */
  #powerup-bar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; pointer-events: none;
  }
  .pu-icon {
    width: 40px; height: 40px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 20px;
    border: 2px solid; opacity: 0.3; transition: opacity 0.3s;
  }
  .pu-icon.active { opacity: 1; animation: pu-pulse 0.5s ease-in-out infinite; }
  @keyframes pu-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  /* Wave announcement */
  #wave-announce {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 52px; font-weight: 900; color: #0ff; letter-spacing: 6px;
    text-shadow: 0 0 30px #0ff, 0 0 60px #0ff; opacity: 0;
    pointer-events: none; transition: opacity 0.5s;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui-overlay">
  <div id="hud" class="hidden">
    <div class="hud-item">SCORE <span id="score-val">0</span></div>
    <div class="hud-item">WAVE <span id="wave-val">1</span></div>
    <div class="hud-item">COMBO <span id="combo-val">x1</span></div>
    <div class="hud-item">
      <span id="lives-val"></span>
    </div>
  </div>
  <div id="combo-display"></div>
  <div id="wave-announce"></div>
  <div id="powerup-bar" class="hidden">
    <div class="pu-icon" id="pu-rapid" style="border-color:#0f0;color:#0f0" title="Rapid Fire">⚡</div>
    <div class="pu-icon" id="pu-spread" style="border-color:#f80;color:#f80" title="Spread Shot">✦</div>
    <div class="pu-icon" id="pu-shield" style="border-color:#08f;color:#08f" title="Shield">🛡</div>
    <div class="pu-icon" id="pu-nuke" style="border-color:#f00;color:#f00" title="Screen Nuke">💥</div>
  </div>
</div>

<div id="menu-screen">
  <div class="title">NEON BLITZ</div>
  <div class="subtitle">ARENA SHOOTER</div>
  <button class="menu-btn" onclick="startGame()">START GAME</button>
  <div class="controls-info">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> to move<br>
    <kbd>Mouse</kbd> to aim &bull; <kbd>Click</kbd> to shoot<br>
    <kbd>Space</kbd> to activate nuke &bull; <kbd>P</kbd> to pause
  </div>
</div>

<div id="game-over-screen" class="hidden">
  <div class="go-label">GAME OVER</div>
  <div id="final-score">0</div>
  <div id="final-wave">Wave 1</div>
  <div id="final-kills">0 enemies destroyed</div>
  <div id="score-form">
    <input type="text" id="player-name" placeholder="Your name" maxlength="20">
    <button class="menu-btn" style="padding:10px 20px;font-size:14px" onclick="submitScore()">SAVE</button>
  </div>
  <div id="leaderboard"></div>
  <button class="menu-btn pink" onclick="startGame()">PLAY AGAIN</button>
  <button class="menu-btn" onclick="showMenu()">MENU</button>
</div>

<div id="pause-screen" class="hidden">
  <div class="title" style="font-size:48px">PAUSED</div>
  <button class="menu-btn" onclick="resumeGame()">RESUME</button>
  <button class="menu-btn pink" onclick="showMenu()">QUIT</button>
</div>

<script>
// ======================== CANVAS SETUP ========================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ======================== GAME STATE ========================
let player, bullets, enemies, particles, powerups, stars;
let score, wave, combo, comboTimer, kills, lives;
let gameRunning, gamePaused, gameOver;
let mouseX, mouseY, mouseDown;
let keys = {};
let activePowerups = { rapid: 0, spread: 0, shield: 0, nuke: 0 };
let waveTimer, waveEnemiesLeft, waveDelay;
let screenShake = 0;
let spawnTimer = 0;
let difficulty = 1;

// ======================== HELPERS ========================
function rand(a, b) { return Math.random() * (b - a) + a; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function angle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }

// ======================== STARS (background) ========================
function initStars() {
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.5, 2), a: rand(0.2, 0.8), speed: rand(0.1, 0.5) });
  }
}
function drawStars() {
  for (let s of stars) {
    ctx.globalAlpha = s.a + Math.sin(Date.now() * 0.001 * s.speed) * 0.2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ======================== PLAYER ========================
function createPlayer() {
  return {
    x: W / 2, y: H / 2, r: 16, angle: 0,
    vx: 0, vy: 0, speed: 5, shootCooldown: 0,
    invincible: 0, trail: []
  };
}

function drawPlayer() {
  let p = player;
  if (p.invincible > 0 && Math.floor(p.invincible * 10) % 2 === 0) return;

  // Trail
  ctx.lineWidth = 2;
  for (let i = 1; i < p.trail.length; i++) {
    let alpha = i / p.trail.length * 0.5;
    ctx.strokeStyle = `rgba(0,255,255,${alpha})`;
    ctx.beginPath();
    ctx.moveTo(p.trail[i - 1].x, p.trail[i - 1].y);
    ctx.lineTo(p.trail[i].x, p.trail[i].y);
    ctx.stroke();
  }

  // Shield glow
  if (activePowerups.shield > 0) {
    ctx.strokeStyle = 'rgba(0,136,255,0.5)';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#08f';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Ship body
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);

  // Glow
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 20;

  ctx.fillStyle = '#0ff';
  ctx.beginPath();
  ctx.moveTo(20, 0);
  ctx.lineTo(-14, -12);
  ctx.lineTo(-8, 0);
  ctx.lineTo(-14, 12);
  ctx.closePath();
  ctx.fill();

  // Inner detail
  ctx.fillStyle = '#0a0a0f';
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(-6, -6);
  ctx.lineTo(-2, 0);
  ctx.lineTo(-6, 6);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.restore();

  // Engine flame
  if (p.vx !== 0 || p.vy !== 0) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle + Math.PI);
    let flicker = rand(8, 16);
    let grad = ctx.createLinearGradient(6, 0, 6 + flicker, 0);
    grad.addColorStop(0, 'rgba(0,255,255,0.8)');
    grad.addColorStop(0.5, 'rgba(255,0,255,0.4)');
    grad.addColorStop(1, 'rgba(255,0,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(6, -5);
    ctx.lineTo(6 + flicker, 0);
    ctx.lineTo(6, 5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function updatePlayer(dt) {
  let p = player;
  let ax = 0, ay = 0;
  if (keys['KeyW'] || keys['ArrowUp']) ay = -1;
  if (keys['KeyS'] || keys['ArrowDown']) ay = 1;
  if (keys['KeyA'] || keys['ArrowLeft']) ax = -1;
  if (keys['KeyD'] || keys['ArrowRight']) ax = 1;

  if (ax || ay) {
    let len = Math.hypot(ax, ay);
    ax /= len; ay /= len;
  }

  p.vx = lerp(p.vx, ax * p.speed, 0.15);
  p.vy = lerp(p.vy, ay * p.speed, 0.15);
  p.x += p.vx * dt * 60;
  p.y += p.vy * dt * 60;

  // Wrap around edges
  if (p.x < -20) p.x = W + 20;
  if (p.x > W + 20) p.x = -20;
  if (p.y < -20) p.y = H + 20;
  if (p.y > H + 20) p.y = -20;

  p.angle = Math.atan2(mouseY - p.y, mouseX - p.x);

  // Trail
  p.trail.push({ x: p.x, y: p.y });
  if (p.trail.length > 20) p.trail.shift();

  // Shooting
  p.shootCooldown -= dt;
  let fireRate = activePowerups.rapid > 0 ? 0.07 : 0.15;
  if (mouseDown && p.shootCooldown <= 0) {
    shoot();
    p.shootCooldown = fireRate;
  }

  if (p.invincible > 0) p.invincible -= dt;
}

// ======================== BULLETS ========================
function shoot() {
  let p = player;
  let bSpeed = 12;

  if (activePowerups.spread > 0) {
    for (let i = -2; i <= 2; i++) {
      let a = p.angle + i * 0.15;
      bullets.push({
        x: p.x + Math.cos(p.angle) * 20,
        y: p.y + Math.sin(p.angle) * 20,
        vx: Math.cos(a) * bSpeed,
        vy: Math.sin(a) * bSpeed,
        life: 1.2, r: 4,
        color: '#f80'
      });
    }
  } else {
    bullets.push({
      x: p.x + Math.cos(p.angle) * 20,
      y: p.y + Math.sin(p.angle) * 20,
      vx: Math.cos(p.angle) * bSpeed,
      vy: Math.sin(p.angle) * bSpeed,
      life: 1.2, r: 4,
      color: '#0ff'
    });
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx * dt * 60;
    b.y += b.vy * dt * 60;
    b.life -= dt;
    if (b.life <= 0 || b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
      bullets.splice(i, 1);
    }
  }
}

function drawBullets() {
  for (let b of bullets) {
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();

    // Bullet trail
    ctx.strokeStyle = b.color.replace(')', ',0.3)').replace('rgb', 'rgba').replace('#', '');
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = b.r;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.3, b.y - b.vy * 0.3);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;
}

// ======================== ENEMIES ========================
const ENEMY_TYPES = {
  chaser: { r: 14, speed: 2, hp: 1, color: '#f44', score: 100, behavior: 'chase' },
  fast: { r: 10, speed: 4.5, hp: 1, color: '#f80', score: 150, behavior: 'chase' },
  tank: { r: 24, speed: 1.2, hp: 4, color: '#a0f', score: 300, behavior: 'chase' },
  shooter: { r: 16, speed: 1.5, hp: 2, color: '#ff0', score: 250, behavior: 'shoot' },
  splitter: { r: 20, speed: 1.8, hp: 2, color: '#0f8', score: 200, behavior: 'chase' },
  zigzag: { r: 12, speed: 3, hp: 1, color: '#f0f', score: 175, behavior: 'zigzag' }
};

function spawnEnemy(type, x, y) {
  let def = ENEMY_TYPES[type];
  if (!x) {
    let side = Math.floor(rand(0, 4));
    if (side === 0) { x = rand(0, W); y = -30; }
    else if (side === 1) { x = W + 30; y = rand(0, H); }
    else if (side === 2) { x = rand(0, W); y = H + 30; }
    else { x = -30; y = rand(0, H); }
  }
  enemies.push({
    x, y, r: def.r, speed: def.speed * (1 + (wave - 1) * 0.05),
    hp: def.hp, maxHp: def.hp, color: def.color,
    score: def.score, type, behavior: def.behavior,
    shootTimer: rand(1, 3), zigTimer: 0, zigDir: 1,
    spawnAnim: 1
  });
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];

    // Spawn animation
    if (e.spawnAnim > 0) {
      e.spawnAnim -= dt * 2;
      continue;
    }

    let a = angle(e, player);

    if (e.behavior === 'chase' || e.behavior === 'shoot') {
      e.x += Math.cos(a) * e.speed * dt * 60;
      e.y += Math.sin(a) * e.speed * dt * 60;
    } else if (e.behavior === 'zigzag') {
      e.zigTimer += dt;
      if (e.zigTimer > 0.5) { e.zigDir *= -1; e.zigTimer = 0; }
      let perpA = a + Math.PI / 2 * e.zigDir;
      e.x += (Math.cos(a) * e.speed + Math.cos(perpA) * e.speed * 0.7) * dt * 60;
      e.y += (Math.sin(a) * e.speed + Math.sin(perpA) * e.speed * 0.7) * dt * 60;
    }

    // Shooter behavior
    if (e.behavior === 'shoot') {
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = Math.max(1, 3 - wave * 0.1);
        enemyShoot(e);
      }
    }

    // Bullet collision
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (dist(e, bullets[j]) < e.r + bullets[j].r) {
        e.hp--;
        spawnParticles(bullets[j].x, bullets[j].y, e.color, 5, 3);
        bullets.splice(j, 1);
        if (e.hp <= 0) {
          killEnemy(e, i);
          break;
        }
      }
    }

    // Player collision (check if enemy still exists)
    if (e.hp > 0 && dist(e, player) < e.r + player.r) {
      if (activePowerups.shield > 0) {
        killEnemy(e, i);
      } else if (player.invincible <= 0) {
        hitPlayer();
        enemies.splice(i, 1);
        spawnParticles(e.x, e.y, e.color, 15, 5);
      }
    }
  }
}

let enemyBullets = [];
function enemyShoot(e) {
  let a = angle(e, player);
  enemyBullets.push({
    x: e.x, y: e.y,
    vx: Math.cos(a) * 5, vy: Math.sin(a) * 5,
    life: 3, r: 5, color: '#ff0'
  });
}

function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    let b = enemyBullets[i];
    b.x += b.vx * dt * 60;
    b.y += b.vy * dt * 60;
    b.life -= dt;
    if (b.life <= 0 || b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
      enemyBullets.splice(i, 1);
      continue;
    }
    if (dist(b, player) < player.r + b.r) {
      if (activePowerups.shield > 0) {
        spawnParticles(b.x, b.y, '#08f', 8, 3);
        enemyBullets.splice(i, 1);
      } else if (player.invincible <= 0) {
        hitPlayer();
        enemyBullets.splice(i, 1);
      }
    }
  }
}

function drawEnemyBullets() {
  for (let b of enemyBullets) {
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function killEnemy(e, idx) {
  score += e.score * combo;
  kills++;
  combo++;
  comboTimer = 2;
  waveEnemiesLeft--;

  spawnParticles(e.x, e.y, e.color, 20, 6);
  screenShake = 0.15;

  // Drop powerup chance
  if (Math.random() < 0.12) {
    spawnPowerup(e.x, e.y);
  }

  // Splitter spawns two small chasers
  if (e.type === 'splitter') {
    spawnEnemy('fast', e.x - 15, e.y);
    spawnEnemy('fast', e.x + 15, e.y);
    waveEnemiesLeft += 2;
  }

  enemies.splice(idx, 1);
  updateHUD();
}

function drawEnemies() {
  for (let e of enemies) {
    let scale = e.spawnAnim > 0 ? (1 - e.spawnAnim) : 1;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(scale, scale);

    // Glow
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 15;

    // Body
    ctx.fillStyle = e.color;
    if (e.type === 'tank') {
      // Hexagon for tank
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        let a = (Math.PI * 2 / 6) * i - Math.PI / 6;
        ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r);
      }
      ctx.closePath();
      ctx.fill();
    } else if (e.type === 'shooter') {
      // Diamond
      ctx.beginPath();
      ctx.moveTo(0, -e.r);
      ctx.lineTo(e.r, 0);
      ctx.lineTo(0, e.r);
      ctx.lineTo(-e.r, 0);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === 'splitter') {
      // Triangle
      ctx.beginPath();
      ctx.moveTo(0, -e.r);
      ctx.lineTo(e.r * 0.87, e.r * 0.5);
      ctx.lineTo(-e.r * 0.87, e.r * 0.5);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // HP bar for tanks
    if (e.maxHp > 1 && e.hp < e.maxHp) {
      ctx.shadowBlur = 0;
      let barW = e.r * 2;
      ctx.fillStyle = '#300';
      ctx.fillRect(-barW / 2, -e.r - 8, barW, 4);
      ctx.fillStyle = e.color;
      ctx.fillRect(-barW / 2, -e.r - 8, barW * (e.hp / e.maxHp), 4);
    }

    // Inner detail
    ctx.fillStyle = '#0a0a0f';
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ======================== PARTICLES ========================
function spawnParticles(x, y, color, count, maxSpeed) {
  for (let i = 0; i < count; i++) {
    let a = rand(0, Math.PI * 2);
    let s = rand(1, maxSpeed);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.3, 0.8), maxLife: rand(0.3, 0.8),
      r: rand(1.5, 4), color,
      friction: 0.96
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vx *= p.friction;
    p.vy *= p.friction;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (let p of particles) {
    let alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// ======================== POWERUPS ========================
const PU_TYPES = ['rapid', 'spread', 'shield', 'nuke'];
const PU_COLORS = { rapid: '#0f0', spread: '#f80', shield: '#08f', nuke: '#f00' };
const PU_SYMBOLS = { rapid: '⚡', spread: '✦', shield: '🛡', nuke: '💥' };

function spawnPowerup(x, y) {
  let type = PU_TYPES[Math.floor(rand(0, PU_TYPES.length))];
  powerups.push({
    x, y, type, r: 12, life: 8,
    color: PU_COLORS[type], symbol: PU_SYMBOLS[type],
    bob: rand(0, Math.PI * 2)
  });
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    let pu = powerups[i];
    pu.life -= dt;
    pu.bob += dt * 3;
    if (pu.life <= 0) { powerups.splice(i, 1); continue; }

    if (dist(pu, player) < pu.r + player.r + 10) {
      activatePowerup(pu.type);
      spawnParticles(pu.x, pu.y, pu.color, 15, 4);
      powerups.splice(i, 1);
    }
  }
}

function activatePowerup(type) {
  if (type === 'nuke') {
    activePowerups.nuke++;
    updatePUBar();
    return;
  }
  activePowerups[type] = 8; // 8 seconds duration
  updatePUBar();
}

function useNuke() {
  if (activePowerups.nuke <= 0) return;
  activePowerups.nuke--;
  screenShake = 0.4;

  // Flash
  nukeFlash = 1;

  for (let e of enemies) {
    score += e.score;
    kills++;
    waveEnemiesLeft--;
    spawnParticles(e.x, e.y, e.color, 15, 8);
  }
  enemies = [];
  enemyBullets = [];
  updateHUD();
  updatePUBar();
}

let nukeFlash = 0;

function updateActivePowerups(dt) {
  for (let key of ['rapid', 'spread', 'shield']) {
    if (activePowerups[key] > 0) {
      activePowerups[key] -= dt;
      if (activePowerups[key] <= 0) activePowerups[key] = 0;
    }
  }
  if (nukeFlash > 0) nukeFlash -= dt * 3;
  updatePUBar();
}

function drawPowerups() {
  for (let pu of powerups) {
    let yOff = Math.sin(pu.bob) * 4;
    let alpha = pu.life < 2 ? 0.3 + (Math.sin(pu.life * 10) * 0.35 + 0.35) : 1;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = pu.color;
    ctx.shadowBlur = 15;

    // Outer ring
    ctx.strokeStyle = pu.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y + yOff, pu.r + 4, 0, Math.PI * 2);
    ctx.stroke();

    // Inner fill
    ctx.fillStyle = pu.color;
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y + yOff, pu.r, 0, Math.PI * 2);
    ctx.fill();

    // Symbol
    ctx.globalAlpha = alpha;
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(pu.symbol, pu.x, pu.y + yOff);

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

function updatePUBar() {
  document.getElementById('pu-rapid').className = 'pu-icon' + (activePowerups.rapid > 0 ? ' active' : '');
  document.getElementById('pu-spread').className = 'pu-icon' + (activePowerups.spread > 0 ? ' active' : '');
  document.getElementById('pu-shield').className = 'pu-icon' + (activePowerups.shield > 0 ? ' active' : '');
  document.getElementById('pu-nuke').className = 'pu-icon' + (activePowerups.nuke > 0 ? ' active' : '');
  document.getElementById('pu-nuke').textContent = activePowerups.nuke > 0 ? '💥' + activePowerups.nuke : '💥';
}

// ======================== WAVE SYSTEM ========================
function startWave() {
  wave++;
  difficulty = 1 + (wave - 1) * 0.15;
  let enemyCount = 5 + wave * 3;
  waveEnemiesLeft = enemyCount;
  spawnTimer = 0;

  // Show wave announcement
  let el = document.getElementById('wave-announce');
  el.textContent = 'WAVE ' + wave;
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 1500);

  updateHUD();
}

function getWaveEnemyType() {
  let types = ['chaser'];
  if (wave >= 2) types.push('fast');
  if (wave >= 3) types.push('zigzag');
  if (wave >= 4) types.push('shooter');
  if (wave >= 5) types.push('splitter');
  if (wave >= 6) types.push('tank');
  return types[Math.floor(rand(0, types.length))];
}

function updateWaveSpawner(dt) {
  if (waveEnemiesLeft <= 0 && enemies.length === 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) {
      startWave();
      waveDelay = 3;
    }
    return;
  }

  if (waveEnemiesLeft > enemies.length) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      let maxOnScreen = Math.min(8 + wave * 2, 30);
      if (enemies.length < maxOnScreen) {
        spawnEnemy(getWaveEnemyType());
      }
      spawnTimer = Math.max(0.3, 1.5 - wave * 0.08);
    }
  }
}

// ======================== PLAYER HIT ========================
function hitPlayer() {
  if (player.invincible > 0) return;
  lives--;
  player.invincible = 2;
  screenShake = 0.3;
  combo = 1;
  spawnParticles(player.x, player.y, '#0ff', 30, 6);
  updateHUD();

  if (lives <= 0) {
    endGame();
  }
}

// ======================== HUD ========================
function updateHUD() {
  document.getElementById('score-val').textContent = score.toLocaleString();
  document.getElementById('wave-val').textContent = wave;
  document.getElementById('combo-val').textContent = 'x' + combo;
  document.getElementById('lives-val').innerHTML = '❤️'.repeat(Math.max(0, lives));
}

// ======================== COMBO ========================
function updateCombo(dt) {
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      combo = 1;
      updateHUD();
    }
  }

  let cd = document.getElementById('combo-display');
  if (combo >= 5) {
    cd.textContent = combo + 'x COMBO!';
    cd.style.opacity = 1;
    cd.style.color = combo >= 20 ? '#ff0' : combo >= 10 ? '#f80' : '#f0f';
    cd.style.fontSize = Math.min(48 + combo * 2, 80) + 'px';
  } else {
    cd.style.opacity = 0;
  }
}

// ======================== GAME FLOW ========================
function startGame() {
  document.getElementById('menu-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('pause-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('powerup-bar').classList.remove('hidden');

  player = createPlayer();
  bullets = [];
  enemies = [];
  enemyBullets = [];
  particles = [];
  powerups = [];
  score = 0;
  wave = 0;
  combo = 1;
  comboTimer = 0;
  kills = 0;
  lives = 5;
  activePowerups = { rapid: 0, spread: 0, shield: 0, nuke: 0 };
  waveDelay = 1;
  waveEnemiesLeft = 0;
  screenShake = 0;
  nukeFlash = 0;
  gameRunning = true;
  gamePaused = false;
  gameOver = false;

  initStars();
  updateHUD();
  updatePUBar();

  if (!window._loopStarted) {
    window._loopStarted = true;
    requestAnimationFrame(gameLoop);
  }
}

function endGame() {
  gameRunning = false;
  gameOver = true;
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('powerup-bar').classList.add('hidden');
  document.getElementById('game-over-screen').classList.remove('hidden');
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('final-wave').textContent = 'Reached Wave ' + wave;
  document.getElementById('final-kills').textContent = kills + ' enemies destroyed';
  loadLeaderboard();
}

function showMenu() {
  gameRunning = false;
  gamePaused = false;
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('powerup-bar').classList.add('hidden');
  document.getElementById('pause-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('menu-screen').classList.remove('hidden');
}

function pauseGame() {
  if (!gameRunning || gameOver) return;
  gamePaused = true;
  document.getElementById('pause-screen').classList.remove('hidden');
}

function resumeGame() {
  gamePaused = false;
  document.getElementById('pause-screen').classList.add('hidden');
  lastTime = performance.now();
}

// ======================== LEADERBOARD ========================
async function loadLeaderboard() {
  try {
    let res = await fetch('/api/scores');
    let scores = await res.json();
    let lb = document.getElementById('leaderboard');
    lb.innerHTML = '<h3>🏆 LEADERBOARD</h3>';
    if (scores.length === 0) {
      lb.innerHTML += '<div style="color:#555;font-size:13px">No scores yet — be the first!</div>';
    }
    scores.forEach((s, i) => {
      lb.innerHTML += `<div class="lb-entry"><span class="lb-name">${i + 1}. ${escapeHtml(s.name)}</span><span class="lb-score">${s.score.toLocaleString()}</span></div>`;
    });
  } catch(e) {}
}

function escapeHtml(text) {
  let d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

async function submitScore() {
  let name = document.getElementById('player-name').value.trim();
  if (!name) return;
  try {
    await fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, score })
    });
    loadLeaderboard();
  } catch(e) {}
}

// ======================== INPUT ========================
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); useNuke(); }
  if (e.code === 'KeyP') {
    if (gamePaused) resumeGame();
    else pauseGame();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
window.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
// Prevent right-click menu
window.addEventListener('contextmenu', e => e.preventDefault());

// ======================== GAME LOOP ========================
let lastTime = performance.now();

function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  let dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (!gameRunning || gamePaused) {
    // Still draw background
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
    drawStars();
    return;
  }

  // Update
  updatePlayer(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateEnemyBullets(dt);
  updateParticles(dt);
  updatePowerups(dt);
  updateActivePowerups(dt);
  updateWaveSpawner(dt);
  updateCombo(dt);

  // Screen shake
  if (screenShake > 0) {
    screenShake -= dt;
    ctx.save();
    ctx.translate(rand(-4, 4), rand(-4, 4));
  }

  // Draw
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  drawStars();

  // Grid lines for arena feel
  ctx.strokeStyle = 'rgba(0,255,255,0.03)';
  ctx.lineWidth = 1;
  let gridSize = 80;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  drawPowerups();
  drawBullets();
  drawEnemyBullets();
  drawEnemies();
  drawPlayer();
  drawParticles();

  // Nuke flash
  if (nukeFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${nukeFlash * 0.6})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (screenShake > 0) {
    ctx.restore();
  }

  // Vignette
  let vgrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.8);
  vgrad.addColorStop(0, 'rgba(0,0,0,0)');
  vgrad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, W, H);
}

// Initialize stars for menu background
initStars();
requestAnimationFrame(function menuDraw(now) {
  if (gameRunning) return;
  requestAnimationFrame(menuDraw);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  drawStars();
});
</script>
